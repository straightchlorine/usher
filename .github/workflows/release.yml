name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GHCR_PREFIX: ghcr.io/${{ github.repository }}
  DOCKERHUB_PREFIX: docker.io/${{ github.repository_owner }}/usher

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from origin/master. Release only from master."
            exit 1
          fi
      - name: Tag matches frontend/package.json
        run: |
          pkg="$(jq -r .version frontend/package.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match frontend/package.json version ${pkg}. Use 'just bump-version' to keep them in sync."
            exit 1
          fi

  publish:
    needs: [ci, verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: docker
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            context: .
            file: Dockerfile
            description: Usher API, event reservation backend (Go)
          - component: web
            context: frontend
            file: frontend/Dockerfile
            description: Usher web, React frontend served by nginx with an /api reverse proxy
    steps:
      - name: Preflight Docker Hub namespace
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$HUB_USER" != "$OWNER" ]; then
            echo "::error::vars.DOCKERHUB_USERNAME ('${HUB_USER}') must equal the GitHub owner ('${OWNER}'), the Docker Hub namespace. Fix the variable in the 'docker' environment."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.GHCR_PREFIX }}/${{ matrix.component }}
            ${{ env.DOCKERHUB_PREFIX }}-${{ matrix.component }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=usher-${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Verify digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::build-push returned no digest"
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign images
        env:
          GHCR: ${{ env.GHCR_PREFIX }}/${{ matrix.component }}
          DOCKERHUB: ${{ env.DOCKERHUB_PREFIX }}-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${GHCR}@${DIGEST}"
          cosign sign --yes "${DOCKERHUB}@${DIGEST}"
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          {
            echo "### usher-${COMPONENT}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`${tag}\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    needs: [ci, verify-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: "true"
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          wranglerVersion: "4.152.0"
          command: deploy
          secrets: |
            PROXY_SHARED_SECRET
        env:
          PROXY_SHARED_SECRET: ${{ secrets.USHER_PROXY_KEY }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          ghcr="ghcr.io/${GITHUB_REPOSITORY}"
          hub="docker.io/${owner}/usher"
          cat > notes.md <<NOTES
          ## Images

          \`\`\`
          docker pull ${ghcr}/api:${version}
          docker pull ${ghcr}/web:${version}
          docker pull ${hub}-api:${version}
          docker pull ${hub}-web:${version}
          \`\`\`

          ## Verify

          \`\`\`
          cosign verify ${ghcr}/api:${version} \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          args=()
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes-file notes.md "${args[@]}"

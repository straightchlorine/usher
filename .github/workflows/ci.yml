name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: event_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_api"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/event_api?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: Load schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init/schema.sql
      - name: Test
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src --max-warnings 0
      - run: npx react-scripts test --watchAll=false
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"
      - run: npm run worker:test
      - name: Worker dry run
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: yamllint
        run: |
          pipx install yamllint==1.37.1
          yamllint .
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: compose config
        run: docker compose config -q

  images:
    # explicit name: the required check contexts are "images (api)" / "images (web)"
    name: images (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            file: Dockerfile
          - component: web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: usher-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
      - name: Build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.component }}
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: usher-${{ matrix.component }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_PORT: "8090"
      WEB_PORT: "8088"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start stack
        run: docker compose up -d --build db usher frontend
      - name: Wait for web and API
        run: |
          # /healthz only proves nginx is up; wait for the proxied API too.
          for _ in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/events || true)"
            if [ "$code" = "200" ]; then
              echo "web and API are ready"
              exit 0
            fi
            sleep 2
          done
          echo "GET /api/events did not return 200 within 180s (last status: ${code:-none})"
          exit 1
      - name: Check SPA and proxy
        run: |
          for path in / /tickets; do
            body="$(curl -fsS "http://localhost:8088${path}")"
            if ! grep -qi '<div id="root"' <<< "$body"; then
              echo "no SPA html at ${path}"
              exit 1
            fi
          done
          count="$(curl -fsS http://localhost:8088/api/events | jq '.events | length')"
          if [ "$count" != "16" ]; then
            echo "expected 16 events through the proxy, got ${count}"
            exit 1
          fi
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
